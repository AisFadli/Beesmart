; === BeeSmart PHP Security Hardening ===
; Disable dangerous functions that enable RCE
disable_functions = exec,system,passthru,shell_exec,popen,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig,pcntl_alarm,dl,putenv,getmypid,getmyuid,leak,apache_child_terminate,posix_kill,posix_mkfifo,posix_setpgid,posix_setsid,posix_setuid,posix_setgid,posix_seteuid,posix_setegid,virtual,show_source,highlight_file

; Prevent file upload abuse
upload_max_filesize = 5M
post_max_size = 10M
max_file_uploads = 5
max_input_vars = 1000
max_input_time = 60

; Disable URL file access (prevent SSRF / remote include RCE)
allow_url_fopen = Off
allow_url_include = Off

; Hide PHP version from HTTP headers
expose_php = Off

; Session hardening
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Strict

; Disable eval-like features where possible
assert.active = 0

; Limit memory and execution
memory_limit = 128M
max_execution_time = 30

; Error handling (no leak in production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/protechid/App/beesmart/logs/php_errors.log
